<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="fr">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kaddi compare les prix autour de chez vous, trajet compris.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kaddi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kaddi</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14532D">
</head>
<body>
<div id="kaddi-splash" style="position:fixed;inset:0;z-index:100000;background:#14532D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
  <div style="font-size:44px;font-weight:800;letter-spacing:-.02em">Kaddi</div>
  <div style="margin-top:8px;opacity:.85">Faites vos courses malin, et local</div>
  <div style="margin-top:22px;width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:#F5C542;border-radius:50%;animation:ks 0.9s linear infinite"></div>
</div>
<style>@keyframes ks{to{transform:rotate(360deg)}}</style>
<script>
window.addEventListener('flutter-first-frame',function(){var e=document.getElementById('kaddi-splash');if(e){e.style.transition='opacity .25s';e.style.opacity=0;setTimeout(function(){e.remove()},300);}});
setTimeout(function(){var e=document.getElementById('kaddi-splash');if(e)e.remove();},20000);
</script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

<div id="kaddi-install" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#14532D;color:#fff;border-radius:14px;padding:12px 14px;font:15px system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.35);align-items:center;gap:10px">
  <span style="flex:1">Installer Kaddi sur votre téléphone</span>
  <button id="kaddi-install-btn" style="background:#F5C542;color:#14532D;border:0;border-radius:10px;padding:9px 14px;font-weight:700">Installer</button>
  <button id="kaddi-install-x" aria-label="Fermer" style="background:none;border:0;color:#fff;font-size:20px">×</button>
</div>
<script>
(function(){var e,b=document.getElementById('kaddi-install');
window.addEventListener('beforeinstallprompt',function(ev){ev.preventDefault();e=ev;
 try{if(localStorage.getItem('kaddi-install-x'))return;}catch(_){}
 b.style.display='flex';});
document.addEventListener('click',function(ev){var t=ev.target;
 if(t.id==='kaddi-install-btn'&&e){e.prompt();e.userChoice.then(function(){b.style.display='none';});}
 if(t.id==='kaddi-install-x'){b.style.display='none';try{localStorage.setItem('kaddi-install-x','1');}catch(_){}}});
window.addEventListener('appinstalled',function(){b.style.display='none';});})();
</script>
</body>
</html>
